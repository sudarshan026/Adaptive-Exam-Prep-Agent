services:
  # ─────────────────────────────────────────────────────────────
  # FastAPI Multi-Agent Backend Web Service
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: aaiea-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_MINUTES
        value: "1440"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"

  # ─────────────────────────────────────────────────────────────
  # React + Vite Frontend Static Site
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: aaiea-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
